[project]
name = "eraifarligt"
version = "2.0.0"
description = "Automatiseret månedlig vurdering af AI-risiko for eraifarligt.dk"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75",
  "feedparser>=6.0.11",
  "Jinja2>=3.1.4",
  "PyYAML>=6.0.2",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
