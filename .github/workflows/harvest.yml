name: Daglig høst

# RSS-feeds rummer kun de sidste 1-2 uger. Uden en daglig høst ville
# månedsvurderingen kun se månedens sidste uger. Denne kørsel bruger ingen
# API-nøgle og koster ingenting.

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC hver dag
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-skrivning
  cancel-in-progress: false

jobs:
  hoest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Høst feeds
        run: PYTHONPATH=src python -m eraifarligt harvest

      - name: Gem puljen
        run: |
          if [ -z "$(git status --porcelain data/raw)" ]; then
            echo "Ingen nye artikler at gemme."
            exit 0
          fi
          git config user.name  "eraifarligt-bot"
          git config user.email "actions@github.com"
          git add data/raw
          git commit -m "Høst $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
